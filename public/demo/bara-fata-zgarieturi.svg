<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#16171a"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7a5e"/>
      <stop offset=".45" stop-color="#3d5a41"/>
      <stop offset="1" stop-color="#1f3122"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="470" width="800" height="130" fill="#0e0f11"/>
  <!-- bară față -->
  <path d="M40 250 Q60 170 200 160 L600 160 Q740 170 760 250 L770 380 Q760 450 690 460 L110 460 Q40 450 30 380 Z" fill="url(#paint)"/>
  <path d="M120 200 Q400 175 680 200" stroke="url(#shine)" stroke-width="18" fill="none"/>
  <!-- grilă -->
  <rect x="250" y="300" width="300" height="90" rx="22" fill="#0c0d0e"/>
  <g stroke="#2a2c30" stroke-width="4">
    <path d="M270 325 H530 M270 345 H530 M270 365 H530"/>
  </g>
  <!-- prize aer laterale -->
  <path d="M80 320 Q120 300 190 310 L180 390 Q120 395 90 380 Z" fill="#0c0d0e"/>
  <path d="M720 320 Q680 300 610 310 L620 390 Q680 395 710 380 Z" fill="#0c0d0e"/>
  <!-- zgârieturi -->
  <g stroke="#d8dcd6" stroke-linecap="round" opacity=".85">
    <path d="M575 405 L700 372" stroke-width="3"/>
    <path d="M585 418 L690 392" stroke-width="2"/>
    <path d="M600 426 L705 400" stroke-width="1.5"/>
    <path d="M640 380 L668 372" stroke-width="2.5"/>
  </g>
  <!-- marcaj -->
  <ellipse cx="640" cy="398" rx="98" ry="58" fill="none" stroke="#e02a2a" stroke-width="7" stroke-dasharray="18 10"/>
  <circle cx="742" cy="330" r="20" fill="#e02a2a"/>
  <text x="742" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
</svg>
